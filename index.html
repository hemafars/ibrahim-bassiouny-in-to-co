<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إبراهيم بسيوني السيد – سكرتير أول القطاع الإقليمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#ffffff;--ink:#1d2a33;--muted:#5d6b75;--accent:#8a5a1f;--accent2:#1f4e5f;--line:#e3ddd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a1f;--card:#1d262d;--ink:#eef1f3;--muted:#a3afb8;--accent:#e0b46a;--accent2:#7fb6c9;--line:#2c3841}}
:root[data-theme="dark"]{--bg:#141a1f;--card:#1d262d;--ink:#eef1f3;--muted:#a3afb8;--accent:#e0b46a;--accent2:#7fb6c9;--line:#2c3841}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.top{background:var(--accent2);color:#fff;padding:32px 24px 56px;text-align:center}
.co{font-size:15px;opacity:.9;letter-spacing:.3px}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--card);color:var(--accent);border:4px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;margin:-48px auto 12px}
.body{padding:0 24px 28px;text-align:center}
h1{margin:0 0 4px;font-size:26px}
.role{color:var(--accent);font-weight:600;font-size:17px;margin:0 0 4px}
.dept{color:var(--muted);font-size:14px;margin:0 0 24px}
.btns{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);background:var(--bg);font-weight:600}
.btn small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.btn .num{direction:ltr;font-size:18px;letter-spacing:.5px}
.btn.wa{background:#1f8a4c;color:#fff;border-color:#1f8a4c;justify-content:center}
.foot{margin-top:22px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="top"><div class="co">شركة مصر لإدارة الأصول العقارية</div></div>
  <div class="avatar" aria-hidden="true">إ</div>
  <div class="body">
    <h1>إبراهيم بسيوني السيد</h1>
    <p class="role">سكرتير أول القطاع الإقليمي</p>
    <p class="dept">شركة مصر لإدارة الأصول العقارية</p>
    <div class="btns">
      <a class="btn" href="tel:+201119717999"><span><small>اتصال – رقم أول</small><span class="num">01119717999</span></span><span aria-hidden="true">📞</span></a>
      <a class="btn" href="tel:+201016393377"><span><small>اتصال – رقم ثانٍ</small><span class="num">01016393377</span></span><span aria-hidden="true">📞</span></a>
      <div class="btn"><span><small>الرقم الداخلي</small><span class="num">201</span></span><span aria-hidden="true">☎️</span></div>
      <a class="btn" href="mailto:i.b.elsayed@misrrea.com"><span><small>البريد الإلكتروني</small><span class="num" style="font-size:15px">i.b.elsayed@misrrea.com</span></span><span aria-hidden="true">✉️</span></a>
      <a class="btn wa" href="https://wa.me/201119717999">مراسلة عبر واتساب</a>
    </div>
    <div class="foot">للتواصل مع سكرتارية القطاع الإقليمي</div>
  </div>
</main>
</body>
</html>
